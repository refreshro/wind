<title>Wind · Azimuthal Equidistant</title>

<style>
  :root {
    --bg: #000005;
    --text: #eeeeee;
    --dim: #8a8f98;
    --panel: rgba(8, 10, 18, 0.82);
    --border: rgba(255, 255, 255, 0.14);
    --accent: #f2cc60;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    background: var(--bg); color: var(--text); overflow: hidden;
    font: 14px/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  }
  #stage { position: absolute; inset: 0; }
  #stage canvas { position: absolute; left: 0; top: 0; }
  #anim { pointer-events: none; }
  #overlay { pointer-events: none; }

  .panel {
    position: absolute; left: 16px; bottom: 16px; max-width: calc(100vw - 32px);
    background: var(--panel); border: 1px solid var(--border); border-radius: 10px;
    padding: 10px 14px; display: grid; grid-template-columns: auto 1fr; gap: 6px 12px; align-items: center;
    backdrop-filter: blur(4px);
  }
  .panel .k { color: var(--dim); font-size: 0.8rem; }
  .panel .v { font-size: 0.88rem; font-variant-numeric: tabular-nums; }
  .scale { display: flex; align-items: center; gap: 8px; font-size: 0.75rem; color: var(--dim); }
  #scaleBar { height: 10px; width: 220px; border-radius: 2px; }
  .btns { display: flex; flex-wrap: wrap; gap: 4px; }
  .btns button {
    font: inherit; font-size: 0.8rem; height: 26px; padding: 0 10px; border-radius: 999px; cursor: pointer;
    background: transparent; border: 1px dashed rgba(255,255,255,0.2); color: var(--dim);
  }
  .btns button.on { border-style: solid; background: rgba(255,255,255,0.1); color: var(--text); }
  .title { position: absolute; left: 16px; top: 14px; font-size: 1.05rem; letter-spacing: 0.04em; color: var(--dim); }
  .title b { color: var(--text); font-weight: 600; }
  @media (max-width: 560px) {
    .panel { left: 8px; right: 8px; bottom: 8px; }
    #scaleBar { width: 140px; }
  }
</style>
</head>
<body>
<div id="stage">
  <canvas id="map"></canvas>
  <canvas id="anim"></canvas>
  <canvas id="overlay"></canvas>
</div>
<div class="title"><b>Wind</b> · azimuthal equidistant</div>

<div class="panel">
  <span class="k">Date</span><span class="v" id="vDate">…</span>

  <span class="k">Source</span><span class="v" id="vSource">…</span>
  <span class="k">Height</span><span class="btns" id="levelBtns"></span>
  <span class="k">Scale</span>

  <span class="k">Point</span><span class="v" id="vPoint">click the map</span>
  <span class="k">Layers</span>
  <span class="btns">
    <button class="on" data-layer="overlay">Overlay</button>
    <button class="on" data-layer="particles">Particles</button>
    <button class="on" data-layer="coast">Coastlines</button>
    <button class="on" data-layer="grid">Grid</button>
  </span>
</div>

<script>
// ============ CONSTANTS (from earth) ============
const OVERLAY_ALPHA = Math.floor(0.4 * 255);  // overlay transparency, on [0, 255]
const INTENSITY_SCALE_STEP = 10;              // step of the particle intensity colour scale
const MAX_PARTICLE_AGE = 100;                 // frames a particle is drawn before it is regenerated
const PARTICLE_LINE_WIDTH = 1.0;
const PARTICLE_MULTIPLIER = 7;                // particle count = globe width in px × this
const FRAME_RATE = 40;                        // ms per frame
const VELOCITY_SCALE = 1 / 60000;             // screen speed of the particles, relative to the globe size
const MAX_INTENSITY = 17;                     // m/s at which a particle reaches full brightness
const DEG = Math.PI / 180;

// ============ STATE ============
const state = {
  edge: -90,              // latitude of the map edge: the whole globe, down to the South Pole
  overlay: true, particles: true, coast: true, grid: true,
};

// ============ DATA ============
// Wind: GFS grid, u (eastward) and v (northward) in m/s ×100, as little-endian Int16 in base64.
// Coastlines and lakes: polylines as Int16 [n, lon×100, lat×100, ...].
const RAW = JSON.parse(document.getElementById('windData').textContent);
function unpack16(b64) {
  const bin = atob(b64);
  const bytes = new Uint8Array(bin.length);
  for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
  return new Int16Array(bytes.buffer);
}
function unpackLines(b64) {
  const a = unpack16(b64), out = [];
  for (let i = 0; i < a.length;) {
    const n = a[i++], pts = new Float32Array(n * 2);
    for (let k = 0; k < n * 2; k++) pts[k] = a[i++] / 100;
    out.push(pts);
  }
  return out;
}

// One entry per height: surface (10 m) and pressure levels (250 hPa ~ 10.5 km, the jet stream level).
const LEVELS = RAW.levels;
let W = null;      // the current level
let GRID = null;   // its grid, unpacked

// Grid with wrapped longitude: the first column is duplicated as the last, to simplify interpolation.
function unpackGrid(W) {
  const u = unpack16(W.u), v = unpack16(W.v);
  const ni = W.nx, nj = W.ny, wrap = Math.floor(ni * W.dx) >= 360;
  const cols = ni + (wrap ? 1 : 0);
  const gu = new Float32Array(cols * nj), gv = new Float32Array(cols * nj);
  for (let j = 0; j < nj; j++) {
    for (let i = 0; i < cols; i++) {
      const s = j * ni + (i % ni);
      gu[j * cols + i] = u[s] / 100;
      gv[j * cols + i] = v[s] / 100;
    }
  }
  return { gu, gv, cols, nj };
}
const gridCache = {};
function setLevel(key) {
  W = LEVELS.find((l) => l.key === key) || LEVELS[0];
  GRID = gridCache[W.key] || (gridCache[W.key] = unpackGrid(W));
}
const COAST = unpackLines(RAW.coast);
const LAKES = unpackLines(RAW.lakes);

// Bilinear interpolation of the wind at (lon, lat). Scan mode 0: longitude grows from lo1,
// latitude falls from la1. Returns [u, v, magnitude] or null.
function interpolateWind(lon, lat) {
  const i = (((lon - W.lo1) % 360) + 360) % 360 / W.dx;
  const j = (W.la1 - lat) / W.dy;
  if (!(j >= 0 && j <= GRID.nj - 1)) return null;
  const fi = Math.floor(i), fj = Math.min(Math.floor(j), GRID.nj - 2);
  const ci = fi + 1, cj = fj + 1;
  const x = i - fi, y = j - fj, rx = 1 - x, ry = 1 - y;
  const a = rx * ry, b = x * ry, c = rx * y, d = x * y;
  const C = GRID.cols, U = GRID.gu, V = GRID.gv;
  const p00 = fj * C + fi, p10 = fj * C + ci, p01 = cj * C + fi, p11 = cj * C + ci;
  const u = U[p00] * a + U[p10] * b + U[p01] * c + U[p11] * d;
  const v = V[p00] * a + V[p10] * b + V[p01] * c + V[p11] * d;
  return [u, v, Math.sqrt(u * u + v * v)];
}

// ============ COLOURS (from earth) ============
function colorInterpolator(start, end) {
  const r = start[0], g = start[1], b = start[2];
  const dr = end[0] - r, dg = end[1] - g, db = end[2] - b;
  return (i, a) => [Math.floor(r + i * dr), Math.floor(g + i * dg), Math.floor(b + i * db), a];
}
function sinebowColor(hue, a) {
  // hue [0, 1] to radians [0, 5/6 τ], then 2/3 cycle per radian
  let rad = hue * 2 * Math.PI * 5 / 6;
  rad *= 0.75;
  const s = Math.sin(rad), c = Math.cos(rad);
  return [Math.floor(Math.max(0, -c) * 255), Math.floor(Math.max(s, 0) * 255), Math.floor(Math.max(c, 0, -s) * 255), a];
}
const BOUNDARY = 0.45;
const fadeToWhite = colorInterpolator(sinebowColor(1.0, 0), [255, 255, 255]);
// Sinebow up to the boundary, then a fade to white.
function extendedSinebowColor(i, a) {
  return i <= BOUNDARY ? sinebowColor(i / BOUNDARY, a) : fadeToWhite((i - BOUNDARY) / (1 - BOUNDARY), a);
}
// Wind overlay: 0..100 m/s.
const windColor = (m, a) => extendedSinebowColor(Math.min(m, 100) / 100, a);
// Particles: grey levels from 85 to 255, brighter with speed.
const PARTICLE_STYLES = [];
for (let j = 85; j <= 255; j += INTENSITY_SCALE_STEP) PARTICLE_STYLES.push(`rgba(${j}, ${j}, ${j}, 1)`);
const intensityIndex = (m) => Math.floor(Math.min(m, MAX_INTENSITY) / MAX_INTENSITY * (PARTICLE_STYLES.length - 1));

// ============ PROJECTION ============
// Azimuthal equidistant, North Pole at the centre: the radius is the true distance to the pole,
// (90 - lat) degrees of arc, scaled so that lat = state.edge lands on the disc edge R.
// Orientation as in SKY: Greenwich at the top (canvas angle 270°), east anticlockwise.
const view = { w: 0, h: 0, cx: 0, cy: 0, R: 0, dpr: 1 };

function project(lon, lat) {
  const r = (90 - lat) / (90 - state.edge) * view.R;
  const t = (270 - lon) * DEG;
  return [view.cx + r * Math.cos(t), view.cy + r * Math.sin(t)];
}
function invert(x, y) {
  const dx = x - view.cx, dy = y - view.cy;
  const r = Math.hypot(dx, dy);
  if (r > view.R) return null;
  const lat = 90 - r / view.R * (90 - state.edge);
  let lon = 270 - Math.atan2(dy, dx) / DEG;
  lon = ((lon + 180) % 360 + 360) % 360 - 180;
  return [lon, lat];
}

// Screen velocity of a wind vector at (x, y). North points to the centre; east is anticlockwise.
// Along a meridian the scale is constant (kR px per degree); along a parallel one degree of arc
// is stretched by c / sin c, c being the colatitude: the azimuthal equidistant distortion,
// the analytic form of earth's numeric distortion().
function screenVelocity(x, y, lat, u, v, scale) {
  const dx = x - view.cx, dy = y - view.cy;
  const r = Math.hypot(dx, dy);
  const kR = view.R / (90 - state.edge);
  let nx = 0, ny = -1;                       // at the pole itself any direction will do
  if (r > 1e-6) { nx = -dx / r; ny = -dy / r; }
  const ex = -ny, ey = nx;                   // east: anticlockwise round the pole
  const c = (90 - lat) * DEG;
  const stretch = c < 1e-6 ? 1 : c / Math.sin(c);
  const ke = kR * stretch, kn = kR;
  return [scale * (u * ke * ex + v * kn * nx), scale * (u * ke * ey + v * kn * ny)];
}

// ============ CANVASES ============
const stage = document.getElementById('stage');
const cvMap = document.getElementById('map');
const cvAnim = document.getElementById('anim');
const cvOver = document.getElementById('overlay');
const gMap = cvMap.getContext('2d');
const gAnim = cvAnim.getContext('2d');
const gOver = cvOver.getContext('2d');

function sizeCanvases() {
  view.dpr = Math.min(window.devicePixelRatio || 1, 2);
  view.w = Math.floor(stage.clientWidth);
  view.h = Math.floor(stage.clientHeight);
  view.cx = Math.round(view.w / 2);
  view.cy = Math.round(view.h / 2);
  view.R = Math.floor(Math.min(view.w, view.h) / 2 * 0.92);
  for (const c of [cvMap, cvAnim, cvOver]) {
    c.width = Math.round(view.w * view.dpr);
    c.height = Math.round(view.h * view.dpr);
    c.style.width = view.w + 'px';
    c.style.height = view.h + 'px';
  }
  for (const g of [gMap, gAnim]) g.setTransform(view.dpr, 0, 0, view.dpr, 0, 0);
}

// ============ MAP ============
// Draws a polyline of [lon, lat] pairs, breaking it where it leaves the map (below the edge).
function strokeLonLat(g, pts) {
  let pen = false;
  for (let k = 0; k < pts.length; k += 2) {
    const lon = pts[k], lat = pts[k + 1];
    if (lat < state.edge) { pen = false; continue; }
    const p = project(lon, lat);
    if (pen) g.lineTo(p[0], p[1]); else { g.moveTo(p[0], p[1]); pen = true; }
  }
}

function drawMap() {
  const g = gMap;
  g.clearRect(0, 0, view.w, view.h);
  // the globe (background sphere)
  g.beginPath();
  g.arc(view.cx, view.cy, view.R, 0, 2 * Math.PI);
  g.fillStyle = '#303030';
  g.fill();

  if (state.grid) {
    // graticule as d3's default: parallels every 10° up to ±80, meridians every 10° up to ±80,
    // and every 90° all the way to the poles
    g.beginPath();
    for (let lat = -80; lat <= 80; lat += 10) {
      if (lat < state.edge) continue;
      const r = (90 - lat) / (90 - state.edge) * view.R;
      g.moveTo(view.cx + r, view.cy);
      g.arc(view.cx, view.cy, r, 0, 2 * Math.PI);
    }
    for (let lon = -180; lon < 180; lon += 10) {
      const full = lon % 90 === 0;
      const a = project(lon, full ? 90 : 80), b = project(lon, Math.max(full ? -90 : -80, state.edge));
      g.moveTo(a[0], a[1]);
      g.lineTo(b[0], b[1]);
    }
    g.strokeStyle = '#505050';
    g.lineWidth = 1;
    g.stroke();
    // the equator, brighter
    g.beginPath();
    const re = 90 / (90 - state.edge) * view.R;
    g.arc(view.cx, view.cy, re, 0, 2 * Math.PI);
    g.strokeStyle = '#707070';
    g.lineWidth = 1.25;
    g.stroke();
  }

  if (state.coast) {
    g.beginPath();
    for (const pts of COAST) strokeLonLat(g, pts);
    for (const pts of LAKES) strokeLonLat(g, pts);
    g.strokeStyle = '#ffffff';
    g.lineWidth = 1.25;
    g.lineJoin = 'round';
    g.stroke();
  }
}

// ============ FIELD ============
// For every 2 × 2 px block inside the disc: the screen velocity of the wind and the overlay colour.
let field = null;

function buildField() {
  const cols = Math.ceil(view.w / 2) + 1, rows = Math.ceil(view.h / 2) + 1;
  const vx = new Float32Array(cols * rows), vy = new Float32Array(cols * rows), mag = new Float32Array(cols * rows).fill(NaN);
  const img = gOver.createImageData(view.w, view.h);
  const data = img.data;
  const scale = view.R * 2 * VELOCITY_SCALE;   // earth: globe bounds height × velocityScale
  for (let cx = 0; cx < cols; cx++) {
    const x = cx * 2;
    for (let cy = 0; cy < rows; cy++) {
      const y = cy * 2;
      const ll = invert(x, y);
      if (!ll) continue;
      const w = interpolateWind(ll[0], ll[1]);
      if (!w) continue;
      const s = screenVelocity(x, y, ll[1], w[0], w[1], scale);
      const k = cy * cols + cx;
      vx[k] = s[0]; vy[k] = s[1]; mag[k] = w[2];
      const col = windColor(w[2], OVERLAY_ALPHA);
      for (let oy = 0; oy < 2; oy++) {
        for (let ox = 0; ox < 2; ox++) {
          const px = x + ox, py = y + oy;
          if (px >= view.w || py >= view.h) continue;
          const p = (py * view.w + px) * 4;
          data[p] = col[0]; data[p + 1] = col[1]; data[p + 2] = col[2]; data[p + 3] = col[3];
        }
      }
    }
  }
  field = { cols, rows, vx, vy, mag, img };
}

function fieldAt(x, y) {
  const cx = Math.round(x / 2), cy = Math.round(y / 2);
  if (cx < 0 || cy < 0 || cx >= field.cols || cy >= field.rows) return -1;
  const k = cy * field.cols + cx;
  return Number.isNaN(field.mag[k]) ? -1 : k;
}

function drawOverlay() {
  gOver.setTransform(1, 0, 0, 1, 0, 0);
  gOver.clearRect(0, 0, cvOver.width, cvOver.height);
  if (!state.overlay) return;
  // the image is built in CSS px; draw it scaled to the device pixels
  const tmp = document.createElement('canvas');
  tmp.width = view.w; tmp.height = view.h;
  tmp.getContext('2d').putImageData(field.img, 0, 0);
  gOver.imageSmoothingEnabled = false;
  gOver.drawImage(tmp, 0, 0, cvOver.width, cvOver.height);
}

// ============ PARTICLES ============
let particles = [];
const buckets = PARTICLE_STYLES.map(() => []);

function randomize(p) {
  // a random point inside the disc (uniform over the area)
  let x, y, safety = 0;
  do {
    const a = Math.random() * 2 * Math.PI, r = view.R * Math.sqrt(Math.random());
    x = Math.round(view.cx + r * Math.cos(a));
    y = Math.round(view.cy + r * Math.sin(a));
  } while (fieldAt(x, y) < 0 && safety++ < 30);
  p.x = x; p.y = y;
  return p;
}

function resetParticles() {
  const count = Math.round(view.R * 2 * PARTICLE_MULTIPLIER);
  particles = [];
  for (let i = 0; i < count; i++) particles.push(randomize({ age: Math.floor(Math.random() * (MAX_PARTICLE_AGE + 1)) }));
  gAnim.clearRect(0, 0, view.w, view.h);
}

function evolve() {
  for (const b of buckets) b.length = 0;
  for (const p of particles) {
    if (p.age > MAX_PARTICLE_AGE) { randomize(p); p.age = 0; }
    const k = fieldAt(p.x, p.y);
    if (k < 0) {
      p.age = MAX_PARTICLE_AGE;              // escaped the field, never to return
    } else {
      const xt = p.x + field.vx[k], yt = p.y + field.vy[k];
      if (fieldAt(xt, yt) >= 0) {
        p.xt = xt; p.yt = yt;
        buckets[intensityIndex(field.mag[k])].push(p);
      } else {
        p.x = xt; p.y = yt;
      }
    }
    p.age += 1;
  }
}

function drawParticles() {
  const g = gAnim;
  // fade the existing trails
  g.globalCompositeOperation = 'destination-in';
  g.fillStyle = 'rgba(0, 0, 0, 0.97)';
  g.fillRect(0, 0, view.w, view.h);
  g.globalCompositeOperation = 'source-over';
  g.lineWidth = PARTICLE_LINE_WIDTH;
  buckets.forEach((bucket, i) => {
    if (!bucket.length) return;
    g.beginPath();
    g.strokeStyle = PARTICLE_STYLES[i];
    for (const p of bucket) {
      g.moveTo(p.x, p.y);
      g.lineTo(p.xt, p.yt);
      p.x = p.xt; p.y = p.yt;
    }
    g.stroke();
  });
}

let timer = null;
function frame() {
  if (state.particles && field) { evolve(); drawParticles(); }
  timer = setTimeout(frame, FRAME_RATE);
}

// ============ PANEL ============
function fmtDate(d) {
  const p = (n) => String(n).padStart(2, '0');
  return `${d.getUTCFullYear()}-${p(d.getUTCMonth() + 1)}-${p(d.getUTCDate())} ${p(d.getUTCHours())}:${p(d.getUTCMinutes())} UTC`;
}
function fillPanel() {
  const d = new Date(W.refTime);
  d.setUTCHours(d.getUTCHours() + W.forecastTime);
  document.getElementById('vDate').textContent = fmtDate(d);
  document.getElementById('vData').textContent = `Wind @ ${W.label} (${W.desc}) · 1° grid`;
  document.getElementById('vSource').textContent = W.source;
  const sb = document.getElementById('scaleBar'), g = sb.getContext('2d');
  for (let x = 0; x < sb.width; x++) {
    const c = windColor(x / (sb.width - 1) * 100, 255);
    g.fillStyle = `rgb(${c[0]}, ${c[1]}, ${c[2]})`;
    g.fillRect(x, 0, 1, sb.height);
  }
}

// Wind at the clicked point: speed and the direction it blows FROM (meteorological convention).
cvMap.addEventListener('click', (e) => {
  const rect = cvMap.getBoundingClientRect();
  if (!field) return;
  const ll = invert(e.clientX - rect.left, e.clientY - rect.top);
  const out = document.getElementById('vPoint');
  if (!ll) { out.textContent = 'outside the map'; return; }
  const w = interpolateWind(ll[0], ll[1]);
  const lat = `${Math.abs(ll[1]).toFixed(2)}° ${ll[1] >= 0 ? 'N' : 'S'}`;
  const lon = `${Math.abs(ll[0]).toFixed(2)}° ${ll[0] >= 0 ? 'E' : 'W'}`;
  if (!w) { out.textContent = `${lat}, ${lon}`; return; }
  const from = ((Math.atan2(-w[0], -w[1]) / DEG) + 360) % 360;
  out.textContent = `${lat}, ${lon} · ${w[2].toFixed(1)} m/s (${(w[2] * 3.6).toFixed(0)} km/h) from ${Math.round(from)}°`;
});

document.querySelectorAll('[data-layer]').forEach((b) => {
  b.addEventListener('click', () => {
    const k = b.dataset.layer;
    state[k] = !state[k];
    b.classList.toggle('on', state[k]);
    if (!field) return;
    if (k === 'overlay') drawOverlay();
    else if (k === 'particles') { if (!state.particles) gAnim.clearRect(0, 0, view.w, view.h); }
    else drawMap();
  });
});

// ============ START ============
// The page can be laid out with zero size (a hidden or still-opening preview pane):
// then nothing is drawn and the rebuild waits for the next resize.
function rebuild() {
  if (stage.clientWidth < 2 || stage.clientHeight < 2) { field = null; return; }
  sizeCanvases();
  drawMap();
  buildField();
  drawOverlay();
  resetParticles();
}
let resizeT = null;
const scheduleRebuild = () => {
  clearTimeout(resizeT);
  resizeT = setTimeout(rebuild, 150);
};
window.addEventListener('resize', scheduleRebuild);
if (window.ResizeObserver) new ResizeObserver(scheduleRebuild).observe(stage);

// Height buttons, one per level in the data.
const levelBtns = document.getElementById('levelBtns');
LEVELS.forEach((l) => {
  const b = document.createElement('button');
  b.textContent = l.key === 'sfc' ? 'Surface' : l.label;
  b.title = l.desc;
  b.dataset.level = l.key;
  b.addEventListener('click', () => {
    setLevel(l.key);
    levelBtns.querySelectorAll('button').forEach((o) => o.classList.toggle('on', o === b));
    fillPanel();
    rebuild();
  });
  levelBtns.appendChild(b);
});

setLevel(LEVELS[0].key);
levelBtns.querySelector('button').classList.add('on');
fillPanel();
rebuild();
frame();
</script>
</body>
</html>
